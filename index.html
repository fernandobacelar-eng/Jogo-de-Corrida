<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Jogo da Velha</h1>

    <div class="status" id="status">Vez de: <span id="turn-indicator">X</span></div>

    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <button class="restart" id="restart-btn">Reiniciar Jogo</button>

    <section class="scoreboard">
      <div class="score">
        <span class="score-label">X</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score">
        <span class="score-label">Empates</span>
        <span class="score-value" id="score-draw">0</span>
      </div>
      <div class="score">
        <span class="score-label">O</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </section>

    <button class="reset-score" id="reset-score-btn">Zerar placar</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
