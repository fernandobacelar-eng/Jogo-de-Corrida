name: Gerar APK da Flauta Guia 2

on:
  push:
    paths:
      - 'flauta-app/**'
      - '.github/workflows/flauta-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flauta-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Compila o APK (tenta de novo se o repositório de bibliotecas falhar)
        run: |
          chmod +x android/gradlew && cd android
          ./gradlew assembleDebug --no-daemon || (sleep 45 && ./gradlew assembleDebug --no-daemon --refresh-dependencies)
      - uses: actions/upload-artifact@v4
        with:
          name: flauta-guia-2-apk
          path: flauta-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Renomeia o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk flauta-guia-2.apk
      - name: Publica o APK com link direto (release "flauta-guia-2")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flauta-guia-2
          target_commitish: ${{ github.sha }}
          name: Flauta Guia 2
          body: |
            Toque em **flauta-guia-2.apk** abaixo para baixar e instalar no Android.
            Link direto: https://github.com/${{ github.repository }}/releases/download/flauta-guia-2/flauta-guia-2.apk
          files: flauta-app/flauta-guia-2.apk
          make_latest: false
