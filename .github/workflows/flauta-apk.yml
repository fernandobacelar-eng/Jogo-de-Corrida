name: Gerar APK da Flauta Guia

on:
  push:
    paths:
      - 'flauta-app/**'
      - '.github/workflows/flauta-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flauta-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: flauta-guia-apk
          path: flauta-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Renomeia o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk flauta-guia.apk
      - name: Publica o APK com link direto (release "flauta-latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flauta-latest
          target_commitish: ${{ github.sha }}
          name: Flauta Guia (versão mais recente)
          body: |
            Toque em **flauta-guia.apk** abaixo para baixar e instalar no Android.
            Link direto: https://github.com/${{ github.repository }}/releases/download/flauta-latest/flauta-guia.apk
          files: flauta-app/flauta-guia.apk
          make_latest: true
